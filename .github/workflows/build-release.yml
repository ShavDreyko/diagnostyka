name: Build Android APK & Windows Portable EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=PL"
          fi

      - name: Run Android unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare Android APK artifact
        run: |
          mkdir -p artifacts-android
          cp app/build/outputs/apk/debug/app-debug.apk artifacts-android/ACOPOS-Diagnosta-Android-debug.apk

      - name: Build signed Release APK (optional, when keystore secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            gradle :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk artifacts-android/ACOPOS-Diagnosta-Android-release.apk
          else
            echo "Pominieto APK Release (brak skonfigurowanych sekretow klucza podpisujacego)."
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACOPOS-Diagnosta-Android-APK
          path: artifacts-android/*.apk
          if-no-files-found: error

  build-windows-portable:
    name: Build Windows Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Run Windows diagnostic engine tests
        run: python -m unittest desktop-windows/test_acopos_desktop.py

      - name: Build single-file Windows Portable EXE
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "ACOPOS-Diagnosta-Portable" `
            --icon "$root\desktop-windows\acopos_icon.ico" `
            --add-data "$root\public\assets\aistudio;assets" `
            --add-data "$root\desktop-windows\acopos_icon.ico;." `
            --distpath "$root\artifacts-windows" `
            --workpath "$root\desktop-windows\build" `
            --specpath "$root\desktop-windows" `
            "$root\desktop-windows\acopos_diagnosta.py"

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          $stage = "artifacts-windows/zip-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "artifacts-windows/ACOPOS-Diagnosta-Portable.exe" "$stage/"
          @(
            "ACOPOS Diagnosta - Wersja Windows Portable",
            "==========================================",
            "1. Uruchom bezposrednio plik ACOPOS-Diagnosta-Portable.exe (nie wymaga instalacji).",
            "2. Baza ponad 750 kodow bledow B&R ACOPOS / Wittmann dziala w pelni offline.",
            "3. Zakladki serwisowe, historia oraz motyw zapisuja sie obok .exe w pliku acopos_data.json."
          ) | Set-Content -Encoding UTF8 "$stage/CZYTAJ-TO.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts-windows/ACOPOS-Diagnosta-Windows-Portable.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Upload Windows Portable EXE & ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACOPOS-Diagnosta-Windows-Portable
          path: |
            artifacts-windows/ACOPOS-Diagnosta-Portable.exe
            artifacts-windows/ACOPOS-Diagnosta-Windows-Portable.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [ build-android, build-windows-portable ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/*.apk
            release-files/*.exe
            release-files/*.zip
